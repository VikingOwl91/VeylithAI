[project]
name = "veylith-v31-env"
version = "0.0.0"
description = "Pinned Veylith v3.1 isolated ROCm training environment"
requires-python = "==3.14.8"
dependencies = [
  "torch==2.14.1+rocm7.2",
  "triton-rocm==3.8.0",
  "filelock==3.32.3",
  "fsspec==2026.7.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.3",
  "mpmath==1.3.0",
  "networkx==3.6.1",
  "setuptools==78.1.0",
  "sympy==1.14.0",
  "typing-extensions==4.16.0",
  "numpy==2.5.4",
  "sentencepiece==0.2.2",
  "pytest==9.1.1",
]

[tool.uv]
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
